version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledgerpulse-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=ledgerpulse-production-secret-aws-2026
      # Optional FREE Groq API Key (Sign up at https://console.groq.com)
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - sqlite_data:/app/prisma

volumes:
  sqlite_data:
